name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audit:release
      - run: npx playwright-core install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm run test:ui
        if: runner.os == 'Linux'
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qinghe-people:verify .
      - run: |
          docker run -d --name people -p 4318:4318 qinghe-people:verify
          curl --retry 10 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:4318/
